<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Main vignette / sky -->
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%"   stop-color="#1a1007" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#0c0804" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030201" stop-opacity="1"/>
    </radialGradient>

    <!-- Bokeh helpers -->
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#EA580C" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FDE68A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b4" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#B45309" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b5" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b6" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#991B1B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom ground glow -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#EA580C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a1200" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Horizontal city-haze band -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#B45309" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>

    <!-- Blur filter for bloom effect -->
    <filter id="blur-sm"  x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur-md"  x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blur-lg"  x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="blur-xl"  x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>

  <!-- Base night sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- ── Far-distance city glow blobs (very soft, large) ──────────── -->
  <ellipse cx="960"  cy="580" rx="600" ry="200" fill="url(#b4)" filter="url(#blur-xl)" opacity="0.5"/>
  <ellipse cx="380"  cy="610" rx="320" ry="160" fill="url(#b2)" filter="url(#blur-xl)" opacity="0.38"/>
  <ellipse cx="1560" cy="620" rx="280" ry="150" fill="url(#b1)" filter="url(#blur-xl)" opacity="0.32"/>

  <!-- ── Mid bokeh lights – large ───────────────────────────────── -->
  <circle cx="210"  cy="520" r="120" fill="url(#b2)" filter="url(#blur-lg)" opacity="0.55"/>
  <circle cx="560"  cy="490" r="90"  fill="url(#b1)" filter="url(#blur-lg)" opacity="0.45"/>
  <circle cx="800"  cy="540" r="140" fill="url(#b4)" filter="url(#blur-lg)" opacity="0.40"/>
  <circle cx="1120" cy="510" r="110" fill="url(#b2)" filter="url(#blur-lg)" opacity="0.48"/>
  <circle cx="1380" cy="470" r="95"  fill="url(#b3)" filter="url(#blur-lg)" opacity="0.42"/>
  <circle cx="1700" cy="530" r="130" fill="url(#b1)" filter="url(#blur-lg)" opacity="0.38"/>
  <circle cx="1850" cy="480" r="80"  fill="url(#b6)" filter="url(#blur-lg)" opacity="0.30"/>
  <circle cx="50"   cy="580" r="100" fill="url(#b4)" filter="url(#blur-lg)" opacity="0.35"/>

  <!-- ── Medium bokeh ───────────────────────────────────────────── -->
  <circle cx="140"  cy="430" r="55"  fill="url(#b3)" filter="url(#blur-md)" opacity="0.60"/>
  <circle cx="420"  cy="400" r="45"  fill="url(#b1)" filter="url(#blur-md)" opacity="0.55"/>
  <circle cx="640"  cy="450" r="60"  fill="url(#b2)" filter="url(#blur-md)" opacity="0.50"/>
  <circle cx="900"  cy="410" r="50"  fill="url(#b3)" filter="url(#blur-md)" opacity="0.48"/>
  <circle cx="1050" cy="460" r="65"  fill="url(#b1)" filter="url(#blur-md)" opacity="0.52"/>
  <circle cx="1240" cy="390" r="48"  fill="url(#b4)" filter="url(#blur-md)" opacity="0.44"/>
  <circle cx="1450" cy="430" r="58"  fill="url(#b2)" filter="url(#blur-md)" opacity="0.50"/>
  <circle cx="1630" cy="400" r="42"  fill="url(#b5)" filter="url(#blur-md)" opacity="0.30"/>
  <circle cx="1780" cy="450" r="52"  fill="url(#b3)" filter="url(#blur-md)" opacity="0.40"/>
  <circle cx="310"  cy="560" r="40"  fill="url(#b6)" filter="url(#blur-md)" opacity="0.35"/>
  <circle cx="730"  cy="370" r="35"  fill="url(#b1)" filter="url(#blur-md)" opacity="0.45"/>
  <circle cx="1310" cy="550" r="44"  fill="url(#b2)" filter="url(#blur-md)" opacity="0.38"/>

  <!-- ── Small bokeh sparkles ───────────────────────────────────── -->
  <circle cx="85"   cy="370" r="18"  fill="url(#b1)" filter="url(#blur-sm)" opacity="0.70"/>
  <circle cx="240"  cy="340" r="14"  fill="url(#b3)" filter="url(#blur-sm)" opacity="0.65"/>
  <circle cx="480"  cy="310" r="20"  fill="url(#b2)" filter="url(#blur-sm)" opacity="0.60"/>
  <circle cx="610"  cy="360" r="12"  fill="url(#b5)" filter="url(#blur-sm)" opacity="0.50"/>
  <circle cx="750"  cy="290" r="16"  fill="url(#b1)" filter="url(#blur-sm)" opacity="0.65"/>
  <circle cx="880"  cy="350" r="22"  fill="url(#b3)" filter="url(#blur-sm)" opacity="0.55"/>
  <circle cx="1010" cy="320" r="15"  fill="url(#b4)" filter="url(#blur-sm)" opacity="0.58"/>
  <circle cx="1160" cy="290" r="19"  fill="url(#b2)" filter="url(#blur-sm)" opacity="0.62"/>
  <circle cx="1290" cy="340" r="13"  fill="url(#b1)" filter="url(#blur-sm)" opacity="0.70"/>
  <circle cx="1430" cy="310" r="21"  fill="url(#b3)" filter="url(#blur-sm)" opacity="0.55"/>
  <circle cx="1550" cy="360" r="16"  fill="url(#b2)" filter="url(#blur-sm)" opacity="0.60"/>
  <circle cx="1680" cy="330" r="18"  fill="url(#b5)" filter="url(#blur-sm)" opacity="0.40"/>
  <circle cx="1800" cy="290" r="14"  fill="url(#b1)" filter="url(#blur-sm)" opacity="0.52"/>
  <circle cx="1890" cy="350" r="20"  fill="url(#b4)" filter="url(#blur-sm)" opacity="0.45"/>
  <circle cx="350"  cy="280" r="11"  fill="url(#b6)" filter="url(#blur-sm)" opacity="0.42"/>
  <circle cx="1100" cy="400" r="10"  fill="url(#b3)" filter="url(#blur-sm)" opacity="0.55"/>
  <circle cx="670"  cy="430" r="14"  fill="url(#b1)" filter="url(#blur-sm)" opacity="0.48"/>
  <circle cx="1500" cy="490" r="12"  fill="url(#b2)" filter="url(#blur-sm)" opacity="0.44"/>

  <!-- ── City silhouette (distant skyline) ─────────────────────── -->
  <rect x="0"    y="600" width="1920" height="480" fill="#030201"/>
  <!-- Building silhouettes -->
  <rect x="50"   y="560" width="60"  height="80"  fill="#060404"/>
  <rect x="70"   y="540" width="20"  height="20"  fill="#060404"/>
  <rect x="130"  y="545" width="80"  height="95"  fill="#070505"/>
  <rect x="145"  y="525" width="50"  height="20"  fill="#070505"/>
  <rect x="220"  y="555" width="50"  height="85"  fill="#060404"/>
  <rect x="280"  y="520" width="90"  height="120" fill="#080606"/>
  <rect x="310"  y="505" width="30"  height="15"  fill="#080606"/>
  <rect x="380"  y="550" width="70"  height="90"  fill="#070505"/>
  <rect x="460"  y="530" width="110" height="110" fill="#090707"/>
  <rect x="480"  y="515" width="70"  height="15"  fill="#090707"/>
  <rect x="580"  y="545" width="60"  height="95"  fill="#070505"/>
  <rect x="650"  y="510" width="100" height="130" fill="#0a0808"/>
  <rect x="665"  y="495" width="70"  height="15"  fill="#0a0808"/>
  <rect x="760"  y="555" width="80"  height="85"  fill="#080606"/>
  <rect x="850"  y="525" width="120" height="115" fill="#0b0909"/>
  <rect x="870"  y="510" width="80"  height="15"  fill="#0b0909"/>
  <rect x="980"  y="540" width="70"  height="100" fill="#090707"/>
  <rect x="1060" y="515" width="95"  height="125" fill="#0a0808"/>
  <rect x="1075" y="500" width="65"  height="15"  fill="#0a0808"/>
  <rect x="1165" y="550" width="65"  height="90"  fill="#080606"/>
  <rect x="1240" y="530" width="85"  height="110" fill="#090707"/>
  <rect x="1258" y="515" width="50"  height="15"  fill="#090707"/>
  <rect x="1335" y="545" width="75"  height="95"  fill="#070505"/>
  <rect x="1420" y="520" width="110" height="120" fill="#0a0808"/>
  <rect x="1440" y="505" width="70"  height="15"  fill="#0a0808"/>
  <rect x="1540" y="555" width="65"  height="85"  fill="#080606"/>
  <rect x="1615" y="535" width="90"  height="105" fill="#090707"/>
  <rect x="1635" y="520" width="50"  height="15"  fill="#090707"/>
  <rect x="1715" y="545" width="80"  height="95"  fill="#070505"/>
  <rect x="1805" y="525" width="115" height="115" fill="#0a0808"/>

  <!-- Window lights on buildings (warm amber dots) -->
  <rect x="60"   y="570" width="6" height="4" fill="#FBBF24" opacity="0.6"/>
  <rect x="74"   y="578" width="6" height="4" fill="#FBBF24" opacity="0.4"/>
  <rect x="140"  y="555" width="6" height="4" fill="#FDE68A" opacity="0.5"/>
  <rect x="155"  y="563" width="6" height="4" fill="#FBBF24" opacity="0.35"/>
  <rect x="293"  y="532" width="6" height="4" fill="#FBBF24" opacity="0.55"/>
  <rect x="305"  y="540" width="6" height="4" fill="#EA580C" opacity="0.40"/>
  <rect x="472"  y="542" width="6" height="4" fill="#FDE68A" opacity="0.50"/>
  <rect x="488"  y="550" width="6" height="4" fill="#FBBF24" opacity="0.40"/>
  <rect x="663"  y="522" width="6" height="4" fill="#FBBF24" opacity="0.55"/>
  <rect x="678"  y="530" width="6" height="4" fill="#FDE68A" opacity="0.40"/>
  <rect x="855"  y="535" width="6" height="4" fill="#FBBF24" opacity="0.50"/>
  <rect x="870"  y="543" width="6" height="4" fill="#EA580C" opacity="0.35"/>
  <rect x="1068" y="525" width="6" height="4" fill="#FDE68A" opacity="0.55"/>
  <rect x="1083" y="533" width="6" height="4" fill="#FBBF24" opacity="0.40"/>
  <rect x="1248" y="540" width="6" height="4" fill="#FBBF24" opacity="0.50"/>
  <rect x="1263" y="548" width="6" height="4" fill="#FDE68A" opacity="0.35"/>
  <rect x="1428" y="530" width="6" height="4" fill="#EA580C" opacity="0.45"/>
  <rect x="1443" y="538" width="6" height="4" fill="#FBBF24" opacity="0.50"/>
  <rect x="1625" y="545" width="6" height="4" fill="#FDE68A" opacity="0.40"/>
  <rect x="1640" y="553" width="6" height="4" fill="#FBBF24" opacity="0.35"/>
  <rect x="1815" y="535" width="6" height="4" fill="#FBBF24" opacity="0.55"/>
  <rect x="1830" y="543" width="6" height="4" fill="#EA580C" opacity="0.40"/>

  <!-- ── Horizontal city-haze band over skyline ─────────────────── -->
  <rect x="0" y="480" width="1920" height="180" fill="url(#haze)"/>

  <!-- ── Bottom ground overlay ──────────────────────────────────── -->
  <rect x="0" y="600" width="1920" height="480" fill="url(#ground)"/>

  <!-- ── Top vignette ───────────────────────────────────────────── -->
  <rect x="0" y="0" width="1920" height="300">
    <animate attributeName="opacity" values="0" dur="0s" fill="freeze"/>
  </rect>
  <defs>
    <linearGradient id="topvig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#020101" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020101" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="280" fill="url(#topvig)"/>
</svg>
